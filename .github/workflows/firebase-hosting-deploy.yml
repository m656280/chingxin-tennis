name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - stable-lucky-7

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHINGXIN_TENNIS }}
        run: |
          echo "$FIREBASE_SA" > /tmp/firebase-sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json \
          firebase deploy --only hosting --project chingxin-tennis 2>&1 | tee /tmp/deploy.log
          EXIT_CODE=${PIPESTATUS[0]}
          if grep -q "current active version" /tmp/deploy.log; then
            echo "Version already active — no new release needed. Treating as success."
            exit 0
          fi
          exit $EXIT_CODE
